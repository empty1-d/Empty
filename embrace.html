<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ø</title>
  <style>
    :root {
      --bg: #030303;
      --ink: #777;
      --highlight: #bbb;
      --dim: #222;
      --glitch-speed: 0.2s;
    }

    * { box-sizing: border-box; cursor: crosshair; }

    /* The Grain / Static Overlay */
    body::before {
      content: "";
      position: fixed;
      top: -100%; left: -100%; width: 300%; height: 300%;
      background: url('https://upload.wikimedia.org/wikipedia/commons/5/5c/Rough_white_noise.png');
      opacity: 0.04;
      pointer-events: none;
      animation: grain 8s steps(10) infinite;
      z-index: 100;
    }

    @keyframes grain {
      0%, 100% { transform:translate(0, 0); }
      10% { transform:translate(-5%, -10%); }
      30% { transform:translate(-15%, 5%); }
      50% { transform:translate(-5%, -5%); }
      70% { transform:translate(-15%, 15%); }
      90% { transform:translate(10%, 5%); }
    }

    /* Scanlines */
    body::after {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 101;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .terminal { max-width: 500px; width: 100%; position: relative; z-index: 10; }

    header { margin-bottom: 60px; }

    h1 {
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 12px;
      color: var(--highlight);
      margin: 0;
      text-shadow: 0 0 5px rgba(255,255,255,0.1);
    }

    .manifesto { line-height: 2; font-size: 13px; margin-bottom: 80px; }
    
    .contract-area {
      margin: 40px 0;
      border: 1px solid var(--dim);
      padding: 20px;
      text-align: center;
      transition: border 0.5s;
    }
    .contract-area:hover { border-color: #444; }

    #ca {
      font-size: 11px;
      word-break: break-all;
      color: var(--highlight);
      background: none;
      border: none;
      width: 100%;
      outline: none;
      text-align: center;
      font-family: inherit;
    }

    .input-ritual {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--dim);
      color: var(--highlight);
      font-family: inherit;
      padding: 10px 0;
      outline: none;
      text-align: center;
    }

    .links {
      margin-top: 80px;
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    a { color: #333; text-decoration: none; font-size: 11px; letter-spacing: 2px; }
    a:hover { color: var(--highlight); }

    .trinity {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #1a1a1a;
      margin-top: 120px;
      letter-spacing: 3px;
    }

    ::placeholder { color: #151515; }

    /* Screen Shake on Error */
    .shake { animation: shake 0.2s ease-in-out; }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(5px); }
      50% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>
  <div class="terminal" id="main-content">
    <header>
      <h1>EMPTY</h1>
      <p style="font-size: 9px; color: #333; margin-top: 5px;">VER 0.0.0 // NO_VALUE_DETECTED</p>
    </header>

    <div class="manifesto">
      <p id="typewriter">The liquidity of meaning has dried up.</p>
      <p style="color: #444;">Conviction is a ghost. <br>The chain is the ritual.</p>
    </div>

    <div class="contract-area">
      <input 
        id="ca" 
        value="DcZUdoSNM1DQJdNdTvnA22skuj8K8V33MpAr9wL3pump" 
        readonly 
        onclick="copyCA()"
      />
    </div>

    <div style="margin-top: 100px; text-align: center;">
      <input 
        id="embraceInput" 
        type="text" 
        class="input-ritual" 
        placeholder="concede?" 
        autocomplete="off"
      />
    </div>

    <nav class="links">
      <a href="https://x.com/Emptycoinonsol" target="_blank">ECHO</a>
      <a href="https://pump.fun" target="_blank">VOID</a>
    </nav>

    <div class="trinity">
      <span>EMPTY</span>
      <span>VACÍO</span>
      <span>空</span>
    </div>
  </div>

  <script>
    const input = document.getElementById("embraceInput");
    const terminal = document.getElementById("main-content");

    function copyCA() {
      const copyText = document.getElementById("ca");
      copyText.select();
      document.execCommand('copy');
      copyText.value = "COPIED TO NULL";
      setTimeout(() => {
        copyText.value = "DcZUdoSNM1DQJdNdTvnA22skuj8K8V33MpAr9wL3pump";
      }, 1000);
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const value = input.value.trim().toLowerCase();
        if (value === "yes" || value === "concede") {
          window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent("I have conceded to the emptiness. Ø"), "_blank");
          input.value = "";
        } else {
          input.value = "";
          terminal.classList.add("shake");
          setTimeout(() => terminal.classList.remove("shake"), 200);
        }
      }
    });

    // Random visual "pop" or flicker
    setInterval(() => {
      if(Math.random() > 0.99) {
        document.body.style.filter = "invert(1)";
        setTimeout(() => { document.body.style.filter = "invert(0)"; }, 30);
      }
    }, 100);
  </script>
</body>
</html>
